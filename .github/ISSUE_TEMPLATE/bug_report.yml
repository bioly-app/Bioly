name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Security problems please not here, but privately (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the backend, Page
        2. Add a countdown
        3. ...
  - type: input
    id: version
    attributes:
      label: Bioly version
      description: Shown in the backend at the bottom left and under Updates
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Server and browser
      description: PHP version (Updates page), hosting, browser and device
      placeholder: "PHP 8.3, shared hosting, Firefox on Android"
  - type: textarea
    id: log
    attributes:
      label: Error log
      description: The last lines of data/logs/app.log, if there are any
      render: text
